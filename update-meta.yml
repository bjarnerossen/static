name: Update HTML Meta

on:
  push:
    branches:
      - main

jobs:
  update-meta:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update meta in HTML
        run: |
          node -e "
            const fs = require('fs');
            const file = 'index.html';
            let html = fs.readFileSync(file, 'utf8');
            const version = 'v1.${{ github.run_number }}';
            const timestamp = new Date().toISOString().replace('T',' ').split('.')[0];
            const commit = '${{ github.sha }}'.slice(0,7);
            const year = new Date().getFullYear();
            const meta = `${version} · ${timestamp} · ${commit} · ${year}`;
            html = html.replace(/<span id=\"meta-data\">.*?<\/span>/s, `<span id=\"meta-data\">${meta}</span>`);
            fs.writeFileSync(file, html);
          "

      - name: Commit and push changes
        run: |
          git add index.html
          git diff --cached --quiet || git commit -m "Auto-update meta"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}